name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AGENTCUT_LOAD_DOTENV: 'false'
  AGENTCUT_AI_SIMULATE: 'true'
  AGENTCUT_VLM_API_KEY: ''
  AGENTCUT_LLM_API_KEY: ''
  PYTHONUTF8: '1'

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: AgentCut-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            AgentCut-ai/requirements-test.txt
            AgentCut-ai/requirements-audio.txt
      - name: Install offline test dependencies
        run: python -m pip install --requirement requirements-test.txt --requirement requirements-audio.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Unit tests, contracts and generated-file drift
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Upload Python test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.python-version }}-reports-${{ github.run_attempt }}
          path: AgentCut-ai/reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  java:
    name: Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AgentCut-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: AgentCut-backend/**/pom.xml
      - name: Build and test every Maven module
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload Java test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-reports-${{ github.run_attempt }}
          path: AgentCut-backend/**/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AgentCut-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AgentCut-front/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Shared contract conformance
        run: npm run test:contracts
      - name: Typecheck and production build
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.run_attempt }}
          path: AgentCut-front/dist/
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [python, java, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every lane to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ['JOB_RESULTS'])
          lines = ['## CI results', '', '| Lane | Result |', '|---|---|']
          failed = []
          for name, job in jobs.items():
              result = job['result']
              lines.append(f'| {name} | {result} |')
              if result != 'success':
                  failed.append(name)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          if failed:
              print('Required lanes did not succeed: ' + ', '.join(failed))
              sys.exit(1)
          PY

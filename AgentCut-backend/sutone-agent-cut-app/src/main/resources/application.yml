server:
  port: 8080

spring:
  application:
    name: sutone-agent-cut
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      # 放开上传大小限制（视频文件较大）
      max-file-size: 500MB
      max-request-size: 500MB
  # 默认(local)用内存仓储，不连接数据库；切 mysql profile 时由 MybatisConfig 手动建 DataSource
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

agentcut:
  render:
    # 字幕中文字体路径（drawtext 渲染用）；按操作系统调整
    subtitle-font: C:/Windows/Fonts/msyh.ttc

# 日志、数据源、Redis、RocketMQ、MinIO 等中间件配置由后续 worker 补充
logging:
  level:
    root: info
